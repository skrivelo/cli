openapi: 3.1.0
info:
  title: '[<]kursiva Render API'
  version: '1.0'
  description: >-
    Deterministic, no-AI template + render service. The calling agent is the
    intelligence; this API discovers templates, describes their input contract,
    and renders a print-grade PDF. v1 is synchronous REST. Schemas are kept
    within the JSON Schema draft-07 ∩ 2020-12 common subset so the same
    components validate at the Fastify runtime and in the contract tests.
    Call this service [<]kursiva when reporting to a human; bare `kursiva` is
    the CLI binary and npm package name, not the product name.
servers:
  - url: /v1
security:
  - ApiKeyAuth: []
paths:
  /v1/doctypes:
    get:
      operationId: listDocTypes
      summary: List document types with template counts.
      responses:
        '200':
          description: Document types.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocType' }
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates:
    get:
      operationId: searchTemplates
      summary: Search templates by query, doc type, and locale.
      parameters:
        - { name: query, in: query, required: false, schema: { type: string } }
        - { name: doc_type, in: query, required: false, schema: { type: string } }
        - { name: locale, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Matching template cards.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TemplateCard' }
        '400':
          description: Unsupported locale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: pushTemplate
      summary: Push a custom template (validate → atomic slot-checked store; Starter+).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushRequest' }
      responses:
        '201':
          description: The stored custom template's id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushResponse' }
        '400':
          description: Validation failed (carries the `diagnostics` array).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Tier below Starter, or the tier slot cap is reached (slot_limit_exceeded).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/{id}:
    get:
      operationId: describeTemplate
      summary: Describe a template's input contract (the keystone).
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TemplateId' }
      responses:
        '200':
          description: The template contract.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateContract' }
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown template id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/render:
    post:
      operationId: renderDocument
      summary: >-
        Render a template with caller content to a PDF. Content fields a given
        template does not declare are ignored. Rejects documents over the page cap.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Opaque retry key (1–255 chars of [A-Za-z0-9._:-]). Repeating a value
            for the same API key AND the same request body returns the original
            result without re-rendering or re-billing; absent, every call is
            metered independently. The stored result is bound to the request that
            produced it, so reusing a key for a different body returns 422
            idempotency_mismatch rather than the earlier document — mint a new key
            per distinct request. `options` is ignored for this comparison. An
            out-of-range value returns 400 invalid_request.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{1,255}$'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenderRequest' }
      responses:
        '200':
          description: Rendered document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderResponse' }
        '400':
          description: >-
            Invalid request, unknown/invalid theme token, page cap exceeded, or too
            many explicit page-break markers (too_many_page_breaks).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >-
            insufficient_tier — the template is not in the free-tier catalog
            (`free_tier` on the template card marks the boundary), or the request
            carries a `profile` on a key below lite.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown template id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            A concurrent request already holds this Idempotency-Key
            (idempotency_conflict); retry once it completes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Request body, embedded-image count, or decoded image size over the input cap.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            Permanent for this request as sent; do not retry it unchanged.
            `idempotency_mismatch` — this Idempotency-Key was already used with a
            different request body. `unrenderable_svg` — the content carries an
            SVG construct WeasyPrint cannot reproduce (a `<filter>`, or one of
            three mask conditions), so the PDF would not match what the content
            describes; `findings` names the offending primitive per element.
            Remove the filter or flatten the region to a raster.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Per-key rate limit or monthly quota exhausted (carries an upgrade hint).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          description: Renderer or ledger failure (fail-closed; never an unmetered document).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/checkout:
    post:
      operationId: checkout
      summary: Start a hosted Paddle checkout to upgrade the caller's key to a paid tier.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '200':
          description: A hosted checkout URL to send the caller to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        '400':
          description: Missing or non-paid tier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Billing/checkout temporarily unavailable (Paddle unreachable).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/signup:
    post:
      operationId: signup
      summary: Request a free-tier key — emails a one-time verification code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '202':
          description: If eligible, a verification code has been emailed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupAccepted' }
        '400':
          description: Invalid or disposable email address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Per-source-IP request rate exceeded (abuse backstop).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/signup/verify:
    post:
      operationId: verifySignup
      summary: Verify the emailed code and receive the key (shown once). Rotates — revokes and replaces — any previous key for the email, so re-running signup recovers a lost key.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyRequest' }
      responses:
        '200':
          description: The issued Free-tier key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupKeyResponse' }
        '400':
          description: Invalid or expired verification code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Per-source-IP request rate exceeded (abuse backstop).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/assets:
    get:
      operationId: listAssets
      summary: List the caller's stored assets (Lite+), oldest first.
      responses:
        '200':
          description: The account's stored assets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetListResponse' }
        '403':
          description: Tier below Lite.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: uploadAsset
      summary: Upload a durable image asset (Lite+); resized server-side, referenced by `img_` id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetUploadRequest' }
      responses:
        '201':
          description: The stored asset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetResponse' }
        '400':
          description: Not a decodable image, or malformed base64.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Tier below Lite.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Uploaded bytes over the flat asset cap.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Per-account durable asset byte or count quota exceeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/assets/{id}:
    delete:
      operationId: deleteAsset
      summary: Delete one of the caller's assets (Lite+).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^img_[0-9a-f]{24}$' }
      responses:
        '200':
          description: Deletion outcome (idempotent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResponse' }
        '403':
          description: Tier below Lite.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/profile:
    get:
      operationId: getProfile
      summary: The caller's stored brand profile (Lite+); empty object when unset.
      responses:
        '200':
          description: The stored profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '403':
          description: Tier below Lite.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: putProfile
      summary: >-
        Replace the stored brand profile (Lite+). Applied to every subsequent
        render under the account; the render body's `profile` field wins per key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePutRequest' }
      responses:
        '200':
          description: The stored profile as saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '400':
          description: >-
            Invalid group/field name, too many groups or fields, or an img_ ref
            that is not an existing asset of this account (invalid_asset_ref).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Tier below Lite.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Profile over the serialized size cap (profile_too_large).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            A profile field holds SVG using constructs the renderer cannot
            reproduce (unrenderable_svg); `findings` names each primitive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteProfile
      summary: Delete the stored brand profile (Lite+); renders return to the neutral identity.
      responses:
        '200':
          description: Deletion outcome (idempotent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResponse' }
        '403':
          description: Tier below Lite.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/{id}/source:
    get:
      operationId: pullTemplateSource
      summary: Pull a curated or owned-custom template's source bundle (Starter+).
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TemplateId' }
      responses:
        '200':
          description: The template source bundle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateSource' }
        '403':
          description: Tier below Starter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown template id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/validate:
    post:
      operationId: validateTemplate
      summary: Validate a custom-template bundle; returns diagnostics without storing (Starter+).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushRequest' }
      responses:
        '200':
          description: Validation result (valid=false when any error-severity diagnostic is present).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidateResponse' }
        '403':
          description: Tier below Starter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/custom:
    get:
      operationId: listCustomTemplates
      summary: List the caller's custom templates (Starter+).
      responses:
        '200':
          description: The caller's custom templates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomTemplateList' }
        '403':
          description: Tier below Starter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/custom/{slug}:
    delete:
      operationId: deleteCustomTemplate
      summary: Delete one of the caller's custom templates (Starter+).
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 64, pattern: '^[a-z0-9][a-z0-9_-]*$' }
      responses:
        '200':
          description: Deletion outcome (idempotent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResponse' }
        '403':
          description: Tier below Starter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: krsv
      description: 'A `krsv_`-prefixed API key sent as `Authorization: Bearer krsv_…`.'
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            hint: { type: string }
        pages_produced: { type: integer }
        cap: { type: integer }
        retry_after: { type: integer }
        quota: { type: integer }
        used: { type: integer }
        period: { type: string }
        limit: { type: integer }
        limit_bytes: { type: integer }
        required: { type: string }
        current: { type: string }
        tier: { type: string }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/Diagnostic' }
        findings:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FilterFinding' }
    FilterFinding:
      type: object
      additionalProperties: false
      required: [elementPath, primitives, reason]
      description: >-
        One SVG region the render cannot reproduce — a construct WeasyPrint
        cannot reproduce, an external dependency the bake cannot fetch, or a
        filter region too large to rasterize at device resolution. Carried by
        `unrenderable_svg` (422) so a caller can locate and remove it.
      properties:
        file:
          type: string
          description: Set only when the finding came from a named file (e.g. a pushed bundle).
        elementPath:
          type: string
          description: Locator within the document, e.g. `data-uri[0]:/svg/rect[1]`.
        primitives:
          type: array
          minItems: 1
          items: { type: string }
          description: The offending filter primitives or mask conditions, e.g. `feGaussianBlur`.
        reason:
          type: string
          enum: [unsupported, external-resource, too-large]
    DocType:
      type: object
      additionalProperties: false
      required: [type, label, count]
      properties:
        type: { type: string }
        label: { type: string }
        count: { type: integer }
        profile_group:
          type: string
          description: >-
            The profile group this document type reads its brand identity from —
            the top-level key to use in a stored or per-request profile.
        profile_fields:
          type: array
          description: The profile fields templates of this type may render.
          items:
            type: object
            additionalProperties: false
            required: [key, type]
            properties:
              key: { type: string }
              type: { type: string }
    TemplateId:
      type: string
      maxLength: 128
      pattern: '^(?:[a-z0-9][a-z0-9_-]*|acct_[0-9a-f]+~[a-z0-9][a-z0-9_-]*|@[a-z0-9][a-z0-9_-]*~[a-z0-9][a-z0-9_-]*)(?:@[1-9][0-9]*)?$'
      description: >-
        Template id (single URL path segment). Curated templates use a bare slug
        (e.g. `crisp-invoice-invoice`); `acct_<id>~<slug>`, `@<version>`, and
        `@<handle>~<slug>` are reserved. This release serves curated slugs only.
    TemplateCard:
      type: object
      additionalProperties: false
      required: [id, name, doc_type, summary, free_tier]
      properties:
        id: { $ref: '#/components/schemas/TemplateId' }
        name: { type: string }
        doc_type: { type: string }
        summary: { type: string }
        free_tier:
          type: boolean
          description: >-
            Renderable on the free tier. False ⇒ render requires the lite tier or
            higher (discovery and describe stay open to every tier).
    PageFormat:
      type: object
      additionalProperties: false
      required: [width, height, unit]
      properties:
        width: { type: number }
        height: { type: number }
        unit: { type: string }
    ContentField:
      type: object
      additionalProperties: false
      required: [key, label, type, required]
      properties:
        key: { type: string }
        label: { type: string }
        type:
          type: string
          enum: [text, textarea, date, serial, block, qrcode, barcode, image]
        required: { type: boolean }
        default:
          description: Literal string default, or a per-language map.
          type: [string, object]
    ThemeToken:
      type: object
      additionalProperties: false
      required: [name, default, type]
      properties:
        name: { type: string }
        default: { type: string }
        type:
          type: string
          enum: [color, length, font, string]
    SamplePayload:
      type: object
      additionalProperties: false
      required: [markdown, fields]
      properties:
        markdown: { type: string }
        fields: { type: object, additionalProperties: true }
    TemplateContract:
      type: object
      additionalProperties: false
      required:
        [
          id,
          doc_type,
          name,
          content_fields,
          theme_tokens,
          locales,
          page_format,
          sample_payload,
          catalog_version,
          content_prompt,
          free_tier
        ]
      properties:
        id: { $ref: '#/components/schemas/TemplateId' }
        catalog_version:
          type: string
          description: Content hash of the corpus snapshot this contract was built from.
        free_tier:
          type: boolean
          description: >-
            Renderable on the free tier. False ⇒ render requires the lite tier or
            higher (discovery and describe stay open to every tier).
        doc_type: { type: string }
        name: { type: string }
        content_fields:
          type: array
          items: { $ref: '#/components/schemas/ContentField' }
        theme_tokens:
          type: array
          items: { $ref: '#/components/schemas/ThemeToken' }
        locales:
          type: array
          items: { type: string }
        page_format: { $ref: '#/components/schemas/PageFormat' }
        sample_payload: { $ref: '#/components/schemas/SamplePayload' }
        content_prompt:
          type: [string, 'null']
          description: >-
            The template author's content rules — e.g. "invoice totals exclude
            VAT". Advisory, never enforced: render does not validate content
            against it. Honour it when generating content for this template.
            Null when the template declares none.
    RenderRequest:
      type: object
      additionalProperties: false
      required: [template_id]
      properties:
        template_id: { $ref: '#/components/schemas/TemplateId' }
        content:
          type: object
          additionalProperties: false
          properties:
            markdown: { type: string }
            fields: { type: object, additionalProperties: true }
        theme:
          type: object
          additionalProperties: { type: string }
        locale: { type: string }
        profile:
          type: object
          description: >-
            Per-request brand identity (Lite+), nested by profile group (see
            `profile_group` on GET /v1/doctypes). Merged over the account's
            stored profile per key within each group — this field wins. Values
            replace the template's neutral sample identity; image-type fields
            take an uploaded asset ref (img_…). With an Idempotency-Key, a
            replay returns the FIRST render's result even if the stored profile
            changed in between.
          additionalProperties:
            type: object
            additionalProperties: { type: [string, number] }
        options:
          type: object
          additionalProperties: true
    RenderResponse:
      type: object
      additionalProperties: false
      required: [document_url, pages, render_ms, renderer_version, catalog_version]
      properties:
        document_url: { type: string }
        pages: { type: integer }
        render_ms: { type: integer }
        renderer_version: { type: string }
        catalog_version:
          type: string
          description: >-
            Content hash of the curated corpus snapshot this render used. Pins
            reproducibility together with renderer_version (a re-render of the same
            inputs under the same pair is byte-comparable).
        warnings:
          type: array
          description: >-
            Non-fatal render warnings. Present only when non-empty (omitted
            entirely for a clean render). Currently the sole code is
            `mermaid_render_failed`, emitted when one or more Mermaid diagrams
            failed to render and shipped as raw source text in the PDF; the
            render still succeeds (200) and is billed.
          items:
            type: object
            additionalProperties: false
            required: [code, count]
            properties:
              code: { type: string, enum: [mermaid_render_failed] }
              count: { type: integer }
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string }
    SignupAccepted:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string }
    VerifyRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email: { type: string }
        code: { type: string }
    SignupKeyResponse:
      type: object
      additionalProperties: false
      required: [api_key, key_id, tier, monthly_quota, rotated]
      properties:
        api_key: { type: string }
        key_id: { type: string }
        tier: { type: string }
        monthly_quota: { type: integer }
        rotated:
          type: boolean
          description: True when a previously issued key for this email was revoked and replaced.
    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [tier]
      properties:
        tier: { type: string, enum: [lite, starter, business] }
    CheckoutResponse:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string }
    BrandProfile:
      type: object
      description: >-
        Brand identity nested by profile group → field key → value. Group and
        key names are 1-64 chars of [a-z0-9_] starting with a letter; image-type
        fields take an uploaded asset ref (img_…).
      additionalProperties:
        type: object
        additionalProperties: { type: [string, number] }
    ProfilePutRequest:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile: { $ref: '#/components/schemas/BrandProfile' }
    ProfileResponse:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile: { $ref: '#/components/schemas/BrandProfile' }
    AssetListResponse:
      type: object
      additionalProperties: false
      required: [assets]
      properties:
        assets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [asset_id, content_type, width, height, bytes, created_at]
            properties:
              asset_id: { type: string, pattern: '^img_[0-9a-f]{24}$' }
              content_type: { type: string }
              width: { type: integer }
              height: { type: integer }
              bytes: { type: integer }
              created_at: { type: string }
    AssetUploadRequest:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: string
          description: Base64-encoded image bytes (png/jpeg/webp/gif). Resized server-side.
        content_type: { type: string }
    AssetResponse:
      type: object
      additionalProperties: false
      required: [asset_id, content_type, width, height, bytes]
      properties:
        asset_id: { type: string, pattern: '^img_[0-9a-f]{24}$' }
        content_type: { type: string }
        width: { type: integer }
        height: { type: integer }
        bytes: { type: integer }
    DeleteResponse:
      type: object
      additionalProperties: false
      required: [deleted]
      properties:
        deleted: { type: boolean }
    Diagnostic:
      type: object
      additionalProperties: false
      required: [severity, where, message]
      properties:
        severity: { type: string, enum: [error, warning] }
        where: { type: string, description: 'Human-locatable site, e.g. `main.html:12`.' }
        message: { type: string }
        fix: { type: string }
    TemplateSource:
      type: object
      additionalProperties: false
      required: [slug, files]
      properties:
        slug: { type: string }
        files:
          type: object
          additionalProperties: { type: string }
          description: Flat filename → text-content map (the pushable bundle).
    PushRequest:
      type: object
      additionalProperties: false
      required: [slug, files]
      properties:
        slug: { type: string, maxLength: 64, pattern: '^[a-z0-9][a-z0-9_-]*$' }
        files:
          type: object
          additionalProperties: { type: string }
    ValidateResponse:
      type: object
      additionalProperties: false
      required: [valid, diagnostics]
      properties:
        valid: { type: boolean }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/Diagnostic' }
    PushResponse:
      type: object
      additionalProperties: false
      required: [id, slug, created, updated_at]
      properties:
        id: { $ref: '#/components/schemas/TemplateId' }
        slug: { type: string }
        created:
          { type: boolean, description: true on first push of the slug; false on replace-in-place. }
        updated_at: { type: string }
    CustomTemplateCard:
      type: object
      additionalProperties: false
      required: [id, slug, bytes, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/TemplateId' }
        slug: { type: string }
        bytes: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }
    CustomTemplateList:
      type: object
      additionalProperties: false
      required: [templates]
      properties:
        templates:
          type: array
          items: { $ref: '#/components/schemas/CustomTemplateCard' }

openapi: 3.1.0
info:
  title: '[<]skrivelo Render API'
  version: '1.0'
  description: >-
    Deterministic, no-AI template + render service. The calling agent is the intelligence; this API
    discovers templates, describes their input contract, and renders a print-grade PDF. v1 is
    synchronous REST. Schemas are kept within the JSON Schema draft-07 ∩ 2020-12 common subset so
    the same components validate at the Fastify runtime and in the contract tests. Call this service
    [<]skrivelo when reporting to a human; bare `skrivelo` is the CLI binary and npm package name,
    not the product name.
servers:
  - url: /v1
security:
  - ApiKeyAuth: []
paths:
  /v1/doctypes:
    get:
      operationId: listDocTypes
      summary: List document types with template counts.
      responses:
        '200':
          description: Document types.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocType' }
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates:
    get:
      operationId: searchTemplates
      summary: Search templates by query, doc type, and locale.
      parameters:
        - { name: query, in: query, required: false, schema: { type: string } }
        - { name: doc_type, in: query, required: false, schema: { type: string } }
        - { name: locale, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Matching template cards.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TemplateCard' }
        '400':
          description: Unsupported locale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: mutateTemplate
      summary: Revision-aware personal template operation (pilot only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalTemplateRequest'
      responses:
        '200':
          description: Saved or conflict copy; use returned template identity and revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalTemplateResult'
        '403':
          description: Pilot access or storage denied.
        '409':
          description: Revision or operation mismatch.
  /v1/templates/{id}:
    get:
      operationId: describeTemplate
      summary: Describe a template's input contract (the keystone).
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TemplateId' }
      responses:
        '200':
          description: The template contract.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateContract' }
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown template id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/render:
    post:
      operationId: renderDocument
      summary: >-
        Render a template with caller content to a PDF. Content fields a given template does not
        declare are ignored. Rejects documents over the page cap.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Opaque retry key (1–255 chars of [A-Za-z0-9._:-]). Repeating a value for the same API
            key AND the same request body returns the original result without re-rendering or
            re-billing; absent, every call is metered independently. The stored result is bound to
            the request that produced it, so reusing a key for a different body returns 422
            idempotency_mismatch rather than the earlier document — mint a new key per distinct
            request. `options` is ignored for this comparison. An out-of-range value returns 400
            invalid_request.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{1,255}$'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenderRequest' }
      responses:
        '200':
          description: Rendered document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderResponse' }
        '400':
          description: >-
            Invalid request, unknown/invalid theme token, page cap exceeded, or too many explicit
            page-break markers (too_many_page_breaks).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >-
            insufficient_tier — the template is not in the free-tier catalog (`free_tier` on the
            template card marks the boundary), or the request carries a `profile` on a key below
            lite.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown template id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            A concurrent request already holds this Idempotency-Key (idempotency_conflict); retry
            once it completes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Request body, embedded-image count, or decoded image size over the input cap.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            Permanent for this request as sent; do not retry it unchanged. `idempotency_mismatch` —
            this Idempotency-Key was already used with a different request body. `unrenderable_svg`
            — the content carries an SVG dependency that cannot be prepared, such as CSS variables
            in an unsupported embedding context; `findings` locates the problem. SVG filters and
            masks are supported by the Chromium renderer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Renderer capacity is busy; retry after the Retry-After delay. No render quota is charged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Per-key rate limit or monthly quota exhausted (carries an upgrade hint).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          description: Renderer or ledger failure (fail-closed; never an unmetered document).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/checkout:
    post:
      operationId: checkout
      summary: Start or reuse a hosted checkout for the authenticated account's API subscription.
      description: >-
        All keys belonging to an account share its API subscription. One recurring checkout may be
        outstanding at a time; the same selection reuses it and a different selection waits for
        verified provider cancellation. Checkouts expire after 24 hours through provider
        cancellation. Existing subscribers must use the preview-confirm change workflow. Paid launch
        approval and current API terms are required. Unknown provider outcomes require
        reconciliation; do not create a replacement purchase to retry them.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '200':
          description: A hosted checkout URL to send the caller to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        '400':
          description: Missing or non-paid tier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Billing/checkout temporarily unavailable (Paddle unreachable).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Current API terms have not been accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: An existing subscription, unresolved purchase, or account deletion prevents checkout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/billing/subscription:
    get:
      operationId: getApiSubscription
      summary: Read the authenticated account's API subscription and billing operations.
      responses:
        '200':
          description: Account-owned billing state without provider identifiers. Never cache this response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingSubscription' }
        default:
          description: Authentication failure or billing temporarily unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/billing/change/preview:
    post:
      operationId: previewApiSubscriptionChange
      summary: Preview an immediate prorated change to an existing paid API tier.
      description: >-
        The account and subscription are resolved from the authenticated key. Free transitions use
        cancellation, not this endpoint. Returns a five-minute, account-bound, single-use preview.
        No subscription is changed by previewing. Existing calendar-period usage is preserved. A
        downgrade that reaches or exceeds the target quota blocks further renders until reset or
        upgrade. Scheduled cancellation, pause, deletion and conflicting operations prevent changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingChangeRequest' }
      responses:
        '200':
          description: Estimated charge or credit, renewal and usage consequences. Never cache this response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingChangePreview' }
        default:
          description:
            Invalid selection, authentication or terms failure, conflicting state, or billing
            unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/billing/change:
    post:
      operationId: confirmApiSubscriptionChange
      summary: Confirm a reviewed change to the same API subscription.
      description: >-
        Rechecks provider state and prices. Stale or expired previews require a new preview and
        confirmation. Updates use prorated_immediately and prevent_change on payment failure. The
        previous entitlement remains until verified; usage never resets. Repeating the same consumed
        preview returns its operation. An uncertain provider result remains processing for
        reconciliation rather than creating another subscription or issuing an automatic refund.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingChangeConfirmation' }
      responses:
        '200':
          description: Durable operation status, which may still be processing. Never cache this response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingOperation' }
        default:
          description: Invalid or expired preview, changed pricing, authentication or terms failure,
            conflicting state, or billing unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/billing/operations/{operationId}:
    get:
      operationId: getApiBillingOperation
      summary: Read a billing operation belonging to the authenticated account.
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description:
            Durable operation status without provider identifiers. Available even while paid launch
            is closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingOperation' }
        '404':
          description: Unknown or foreign operation; these cases are indistinguishable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          description: Authentication failure or billing temporarily unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/signup:
    post:
      operationId: signup
      summary: Request a free-tier key — emails a one-time verification code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '202':
          description: If eligible, a verification code has been emailed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupAccepted' }
        '400':
          description: Invalid or disposable email address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Per-source-IP request rate exceeded (abuse backstop).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/signup/verify:
    post:
      operationId: verifySignup
      summary:
        Verify the emailed code and receive the key (shown once). Rotates — revokes and replaces —
        any previous key for the email, so re-running signup recovers a lost key.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyRequest' }
      responses:
        '200':
          description: The issued Free-tier key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupKeyResponse' }
        '400':
          description: Invalid or expired verification code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Per-source-IP request rate exceeded (abuse backstop).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/assets:
    get:
      operationId: listAssets
      summary: List the caller's stored assets (hosted pilot), oldest first.
      responses:
        '200':
          description: The account's stored assets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetListResponse' }
        '403':
          description: Tier below Lite.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: uploadAsset
      summary: Upload a durable image asset (hosted pilot); resized server-side, referenced by `img_` id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetUploadRequest' }
      responses:
        '201':
          description: The stored asset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetResponse' }
        '400':
          description: Not a decodable image, or malformed base64.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Tier below Lite.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Uploaded bytes over the flat asset cap.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Per-account durable asset byte or count quota exceeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/assets/{id}:
    delete:
      operationId: deleteAsset
      summary: Delete one of the caller's assets (hosted pilot).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^img_[0-9a-f]{24}$' }
      responses:
        '200':
          description: Deletion outcome (idempotent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResponse' }
        '403':
          description: Tier below Lite.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/{id}/source:
    get:
      operationId: pullTemplateSource
      summary: Pull a curated or owned-custom template's source bundle (Starter+).
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TemplateId' }
      responses:
        '200':
          description: The template source bundle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateSource' }
        '403':
          description: Tier below Starter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown template id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/validate:
    post:
      operationId: validateTemplate
      summary: Validate a custom-template bundle; returns diagnostics without storing (Starter+).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateValidateRequest'
      responses:
        '200':
          description: Validation result (valid=false when any error-severity diagnostic is present).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidateResponse' }
        '403':
          description: Tier below Starter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/templates/custom:
    get:
      operationId: listCustomTemplates
      summary: List the caller's custom templates (Starter+).
      responses:
        '200':
          description: The caller's custom templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalTemplateList'
        '403':
          description: Tier below Starter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/assets/upload-tickets:
    post:
      summary: Account-bound browser image upload (pilot only).
      responses:
        '200':
          description: Upload ticket state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicketResponse'
  /v1/assets/upload-tickets/{ticket}:
    get:
      summary: Account-bound browser image upload (pilot only).
      parameters:
        - name: ticket
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
      responses:
        '200':
          description: Upload ticket state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicketStatus'
  /v1/profiles:
    get:
      summary: List account profiles
      parameters:
        - in: query
          name: archived
          schema:
            type: boolean
      responses:
        '200':
          description: Account library result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryList'
  /v1/profiles/{id}:
    get:
      summary: Read an account profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account library result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryItem'
  /v1/profiles/mutations:
    post:
      summary: Create, edit, archive or restore profiles. Duplicate by creating a copy with a new ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryMutation'
      responses:
        '200':
          description: Account library result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryMutationResult'
  /v1/blocks:
    get:
      summary: List account blocks
      parameters:
        - in: query
          name: archived
          schema:
            type: boolean
      responses:
        '200':
          description: Account library result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryList'
  /v1/blocks/{id}:
    get:
      summary: Read an account block
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account library result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryItem'
  /v1/blocks/mutations:
    post:
      summary: Create, edit, archive or restore blocks. Duplicate by creating a copy with a new ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryMutation'
      responses:
        '200':
          description: Account library result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryMutationResult'
  /v1/library:
    get:
      summary: Read the account library for synchronization
      responses:
        '200':
          description: Account library result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySnapshot'
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: krsv
      description: 'A `krsv_`-prefixed API key sent as `Authorization: Bearer krsv_…`.'
  schemas:
    BillingChangeRequest:
      type: object
      additionalProperties: false
      required: [selection]
      properties:
        selection: { type: string, enum: [lite, starter, business] }
    BillingChangeConfirmation:
      type: object
      additionalProperties: false
      required: [previewToken]
      properties:
        previewToken: { type: string, minLength: 1, maxLength: 200 }
    BillingMoney:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+$'
          description: Integer minor currency units. Negative immediate amounts represent credits.
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    BillingChangePreview:
      type: object
      additionalProperties: false
      required:
        [
          token,
          expiresAt,
          selection,
          currentSelection,
          immediate,
          recurring,
          renewalAt,
          quota,
          usage,
          blocksFurtherUsage
        ]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        selection: { type: string }
        currentSelection: { type: string }
        immediate: { $ref: '#/components/schemas/BillingMoney' }
        recurring: { $ref: '#/components/schemas/BillingMoney' }
        renewalAt: { type: [string, 'null'], format: date-time }
        quota: { type: [integer, 'null'], minimum: 0 }
        usage: { type: [integer, 'null'], minimum: 0 }
        blocksFurtherUsage: { type: boolean }
    BillingOperation:
      type: object
      additionalProperties: false
      required: [id, kind, status, selection, createdAt, updatedAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [checkout, change, cancellation] }
        status: { type: string, enum: [processing, succeeded, failed, review] }
        selection: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BillingSubscription:
      type: object
      additionalProperties: false
      required: [product, primarySubscription, selections, operations, deleting, changesEnabled]
      properties:
        product: { type: string, enum: [api] }
        primarySubscription:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [selection, status]
              properties:
                selection: { type: string }
                status: { type: string }
        selections:
          type: array
          items: { type: string }
        operations:
          type: array
          items: { $ref: '#/components/schemas/BillingOperation' }
        deleting: { type: boolean }
        changesEnabled: { type: boolean }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            hint: { type: string }
        pages_produced: { type: integer }
        cap: { type: integer }
        retry_after: { type: integer }
        quota: { type: integer }
        used: { type: integer }
        period: { type: string }
        limit: { type: integer }
        limit_bytes: { type: integer }
        required: { type: string }
        current: { type: string }
        tier: { type: string }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/Diagnostic' }
        findings:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FilterFinding' }
    FilterFinding:
      type: object
      additionalProperties: false
      required: [elementPath, primitives, reason]
      description: >-
        One SVG region or dependency that cannot be prepared for rendering. Carried by
        `unrenderable_svg` (422) so a caller can locate and remove it.
      properties:
        file:
          type: string
          description: Set only when the finding came from a named file (e.g. a pushed bundle).
        elementPath:
          type: string
          description: Locator within the document, e.g. `data-uri[0]:/svg/rect[1]`.
        primitives:
          type: array
          minItems: 1
          items: { type: string }
          description: The offending filter primitives or mask conditions, e.g. `feGaussianBlur`.
        reason:
          type: string
          enum: [unsupported, external-resource, too-large]
    DocType:
      type: object
      additionalProperties: false
      required: [type, label, count]
      properties:
        type: { type: string }
        label: { type: string }
        count: { type: integer }
        profile_group:
          type: string
          description: >-
            The profile group this document type reads its brand identity from — the top-level key
            to use in a stored or per-request profile.
        profile_fields:
          type: array
          description: The profile fields templates of this type may render.
          items:
            type: object
            additionalProperties: false
            required: [key, type]
            properties:
              key: { type: string }
              type: { type: string }
    TemplateId:
      type: string
      maxLength: 128
      pattern: '^(?:[a-z0-9][a-z0-9_-]*|acct_[0-9a-f]+~[a-z0-9][a-z0-9_-]*|@[a-z0-9][a-z0-9_-]*~[a-z0-9][a-z0-9_-]*)(?:@[1-9][0-9]*)?$'
      description: >-
        Template id (single URL path segment). Curated templates use a bare slug (e.g.
        `crisp-invoice-invoice`); `acct_<id>~<slug>`, `@<version>`, and `@<handle>~<slug>` are
        reserved. This release serves curated slugs only.
    TemplateCard:
      type: object
      additionalProperties: false
      required: [id, name, doc_type, summary, free_tier]
      properties:
        id: { $ref: '#/components/schemas/TemplateId' }
        name: { type: string }
        doc_type: { type: string }
        summary: { type: string }
        free_tier:
          type: boolean
          description: >-
            Renderable on the free tier. False ⇒ render requires the lite tier or higher (discovery
            and describe stay open to every tier).
    PageFormat:
      type: object
      additionalProperties: false
      required: [width, height, unit]
      properties:
        width: { type: number }
        height: { type: number }
        unit: { type: string }
    ContentField:
      type: object
      additionalProperties: false
      required: [key, label, type, required]
      properties:
        key: { type: string }
        label: { type: string }
        type:
          type: string
          enum: [text, textarea, date, serial, block, qrcode, barcode, image]
        required: { type: boolean }
        default:
          description: Literal string default, or a per-language map.
          type: [string, object]
    ThemeToken:
      type: object
      additionalProperties: false
      required: [name, default, type]
      properties:
        name: { type: string }
        default: { type: string }
        type:
          type: string
          enum: [color, length, font, string]
    SamplePayload:
      type: object
      additionalProperties: false
      required: [markdown, fields]
      properties:
        markdown: { type: string }
        fields: { type: object, additionalProperties: true }
    TemplateContract:
      type: object
      additionalProperties: false
      required:
        [
          id,
          doc_type,
          name,
          content_fields,
          theme_tokens,
          locales,
          page_format,
          sample_payload,
          catalog_version,
          content_prompt,
          free_tier
        ]
      properties:
        id: { $ref: '#/components/schemas/TemplateId' }
        catalog_version:
          type: string
          description: Content hash of the corpus snapshot this contract was built from.
        free_tier:
          type: boolean
          description: >-
            Renderable on the free tier. False ⇒ render requires the lite tier or higher (discovery
            and describe stay open to every tier).
        doc_type: { type: string }
        name: { type: string }
        content_fields:
          type: array
          items: { $ref: '#/components/schemas/ContentField' }
        theme_tokens:
          type: array
          items: { $ref: '#/components/schemas/ThemeToken' }
        locales:
          type: array
          items: { type: string }
        page_format: { $ref: '#/components/schemas/PageFormat' }
        sample_payload: { $ref: '#/components/schemas/SamplePayload' }
        content_prompt:
          type: [string, 'null']
          description: >-
            The template author's content rules — e.g. "invoice totals exclude VAT". Advisory, never
            enforced: render does not validate content against it. Honour it when generating content
            for this template. Null when the template declares none.
    RenderRequest:
      type: object
      additionalProperties: false
      required: [template_id]
      properties:
        template_id: { $ref: '#/components/schemas/TemplateId' }
        content:
          type: object
          additionalProperties: false
          properties:
            markdown: { type: string }
            fields: { type: object, additionalProperties: true }
        theme:
          type: object
          additionalProperties: { type: string }
        locale: { type: string }
        profile:
          type: object
          description: >-
            Per-document field overrides layered over the selected full account profile. Does not
            edit the saved profile. Empty fields remain empty. Image values use account-owned img_
            IDs.
          additionalProperties:
            type: object
            additionalProperties: { type: [string, number] }
        options:
          type: object
          additionalProperties: true
        profile_id:
          type: string
          description:
            Profile ID. Omit to use the account default. Missing or archived explicit selections
            are rejected.
    RenderResponse:
      type: object
      additionalProperties: false
      required: [document_url, pages, render_ms, renderer_version, catalog_version]
      properties:
        document_url: { type: string }
        pages: { type: integer }
        render_ms: { type: integer }
        renderer_version: { type: string }
        catalog_version:
          type: string
          description: >-
            Content hash of the curated corpus snapshot this render used. Pins reproducibility
            together with renderer_version (a re-render of the same inputs under the same pair is
            byte-comparable).
        warnings:
          type: array
          description: >-
            Non-fatal render warnings. Present only when non-empty (omitted entirely for a clean
            render). Currently the sole code is `mermaid_render_failed`, emitted when one or more
            Mermaid diagrams failed to render and shipped as raw source text in the PDF; the render
            still succeeds (200) and is billed.
          items:
            type: object
            additionalProperties: false
            required: [code, count]
            properties:
              code: { type: string, enum: [mermaid_render_failed] }
              count: { type: integer }
        profile_used:
          type: object
          required:
            - id
            - revision
            - name
          properties:
            id:
              type:
                - string
                - 'null'
            revision:
              type: integer
            name:
              type: string
        template_used:
          type: object
          required:
            - id
            - revision
          properties:
            id:
              type: string
            revision:
              type:
                - string
                - number
        profile_images:
          type: array
          items:
            type: object
            required:
              - asset_id
              - displayed
            properties:
              asset_id:
                type: string
              displayed:
                type: boolean
                description: False when the image is intentionally hidden or unsupported by the template.
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string }
        legalAcceptance:
          type: object
          additionalProperties: false
          required: [termsAccepted, adultConfirmed, version, language, product]
          properties:
